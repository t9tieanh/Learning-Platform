{{> wrapper-start}}
{{> header}}
{{> body-start}}

<table
  role="presentation"
  width="100%"
  cellspacing="0"
  cellpadding="0"
  border="0"
  style="
    margin-bottom: 20px;
    border: 1px solid #fecaca;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(239, 68, 68, 0.08);
  "
>
  <tr>
    <td style="padding: 0">
      {{#if hasThumbnail}}
      <img
        src="{{thumbnailUrl}}"
        alt="{{title}}"
        width="600"
        style="display: block; width: 100%; max-height: 200px; object-fit: cover; border: 0; opacity: 0.85"
      />
      {{else}}
      <div style="height: 120px; background: linear-gradient(145deg, #fee2e2 0%, #fecaca 100%)"></div>
      {{/if}}
      <div style="padding: 20px 22px">
        <p style="margin: 0 0 12px; font-size: 18px; line-height: 1.4; font-weight: 700; color: #0f172a">
          {{title}}
        </p>
        <table
          role="presentation"
          width="100%"
          cellspacing="0"
          cellpadding="0"
          border="0"
          style="background-color: #fef2f2; border-radius: 10px; border-left: 4px solid #ef4444"
        >
          <tr>
            <td style="padding: 14px 16px">
              <p style="margin: 0 0 4px; font-size: 12px; font-weight: 600; color: #b91c1c">Lý do từ chối</p>
              <p style="margin: 0; font-size: 14px; line-height: 1.55; color: #7f1d1d">{{reason}}</p>
            </td>
          </tr>
        </table>
      </div>
    </td>
  </tr>
</table>

<p style="margin: 0; font-size: 15px; line-height: 1.65; color: #475569">
  Vui lòng chỉnh sửa nội dung khóa học theo góp ý và gửi lại để được xét duyệt.
</p>

{{> body-end}}
{{> footer}}
{{> wrapper-end}}
