            <tr>
              <td
                style="
                  background: {{headerGradient}};
                  border-radius: 16px 16px 0 0;
                  padding: 28px 32px 32px;
                "
              >
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td>
                      <span
                        style="
                          display: inline-block;
                          font-size: 22px;
                          font-weight: 800;
                          letter-spacing: -0.02em;
                          color: #ffffff;
                        "
                        >Learnova</span
                      >
                      {{#if badge}}
                      <span
                        style="
                          display: inline-block;
                          margin-left: 10px;
                          padding: 4px 10px;
                          font-size: 11px;
                          font-weight: 600;
                          color: #1e40af;
                          background-color: rgba(255, 255, 255, 0.92);
                          border-radius: 999px;
                          vertical-align: middle;
                        "
                        >{{badge}}</span
                      >
                      {{/if}}
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-top: 20px">
                      <h1
                        style="
                          margin: 0;
                          font-size: 24px;
                          line-height: 1.3;
                          font-weight: 700;
                          color: #ffffff;
                        "
                      >
                        {{headerTitle}}
                      </h1>
                      {{#if headerSubtitle}}
                      <p
                        style="
                          margin: 12px 0 0;
                          font-size: 15px;
                          line-height: 1.6;
                          color: rgba(255, 255, 255, 0.9);
                        "
                      >
                        {{headerSubtitle}}
                      </p>
                      {{/if}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
