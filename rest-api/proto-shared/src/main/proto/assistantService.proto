syntax = "proto3";

import "assistant.proto";

option java_multiple_files = true;
option java_package = "com.example.grpc.assistant";
option java_outer_classname = "AssistantServiceProto";

service AssistantService {
  rpc batchGetLessonTestEligibility(BatchLessonTestEligibilityRequest)
      returns (BatchLessonTestEligibilityResponse);
}
