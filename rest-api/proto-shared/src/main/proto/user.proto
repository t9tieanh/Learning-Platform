syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.grpc.user";
option java_outer_classname = "UserProto";

enum AccountStatus {
  ACTIVE = 0;
  INACTIVE = 1;
}

message Expertise {
  string id = 1;
  string name = 2;
  string image = 3;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  string id = 1;
  string name = 2;
  string image = 3;
  string phone = 4;
  string description = 5;
  string email = 6;
  string username = 7;
  AccountStatus status = 8;
  repeated string roles = 9;

  repeated Expertise expertises = 10;
}

// get bulk Profile
message GetTeachersRequest {
  repeated string teacher_ids = 1;
}

message Teacher {
  string id = 1;
  string name = 2;
  string email = 3;
  string image = 4;
}

message GetTeachersResponse {
  repeated Teacher teachers = 1;
}

message SearchTeachersByIdsRequest {
  repeated string teacher_ids = 1;
  string search = 2;
  int32 page = 3;
  int32 limit = 4;
  string sort = 5;
}

message SearchTeachersByIdsResponse {
  repeated Teacher teachers = 1;
  bool has_next = 2;
}

message TeacherDetail {
  string id = 1;
  string name = 2;
  string image = 3;
  string phone = 4;
  string description = 5;
  string email = 6;
  string username = 7;
  AccountStatus status = 8;
  repeated string roles = 9;

  repeated Expertise expertises = 10;
  repeated Certificate certificates = 11;
}


message Certificate {
  string title = 2;
  string organization = 3;
  string imageUrl = 4;
  string credentialUrl = 5;
}

message InstructorCertificatePreview {
  string id = 1;
  string title = 2;
  string organization = 3;
  string issueDate = 4;
  string imageUrl = 5;
}

message AdminInstructorSummaryProfile {
  string id = 1;
  string name = 2;
  string email = 3;
  string image = 4;
  string description = 5;
  repeated Expertise expertises = 6;
  repeated InstructorCertificatePreview certificates = 7;
  int64 totalCertificates = 8;
}

// CheckIsVip request/response for quiz generation authorization
message CheckIsVipRequest {
  string user_id = 1;
}

message CheckIsVipResponse {
  bool is_vip = 1;
  string message = 2;
}
